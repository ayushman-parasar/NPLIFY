<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="100%" style="display:block; background:#FFFFFF; border:0.5pt solid #bbbbbb"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs><text x="6" y="14" font-size="10" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-weight="bold">Figure 1 — how it fits together, with the resilience decided on 20 October</text><rect x="130" y="30" width="300" height="250" rx="6" fill="none" stroke="#888" stroke-width="0.7" stroke-dasharray="5 3"/><text x="136" y="41" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#888" font-style="italic">NPL&#x27;s AWS account · Hong Kong (ap-east-1)</text><rect x="8" y="60" width="110" height="42.5" rx="4" fill="#EAF0FA" stroke="#3B5C8C" stroke-width="0.8"/><text x="63.0" y="71.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">NPL staff</text><line x1="8" y1="74.5" x2="118" y2="74.5" stroke="#3B5C8C" stroke-width="0.6"/><text x="12" y="85.0" font-size="8" font-family="Menlo, Consolas, monospace">browser, NPLify login</text><text x="12" y="96.5" font-size="8" font-family="Menlo, Consolas, monospace">password + authenticator code</text><rect x="140" y="50" width="130" height="42.5" rx="4" fill="#EAF0FA" stroke="#3B5C8C" stroke-width="0.8"/><text x="205.0" y="61.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">NPLify app · task 1 (zone A)</text><line x1="140" y1="64.5" x2="270" y2="64.5" stroke="#3B5C8C" stroke-width="0.6"/><text x="144" y="75.0" font-size="8" font-family="Menlo, Consolas, monospace">screens · API · jobs</text><text x="144" y="86.5" font-size="8" font-family="Menlo, Consolas, monospace">Next.js, TypeScript</text><rect x="140" y="110" width="130" height="42.5" rx="4" fill="#EAF0FA" stroke="#3B5C8C" stroke-width="0.8"/><text x="205.0" y="121.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">NPLify app · task 2 (zone B)</text><line x1="140" y1="124.5" x2="270" y2="124.5" stroke="#3B5C8C" stroke-width="0.6"/><text x="144" y="135.0" font-size="8" font-family="Menlo, Consolas, monospace">same image; the jobs take</text><text x="144" y="146.5" font-size="8" font-family="Menlo, Consolas, monospace">a lock so only one runs</text><rect x="290" y="50" width="150" height="65.5" rx="4" fill="#DDEFD6" stroke="#4F8A3C" stroke-width="0.8"/><text x="365.0" y="61.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">PostgreSQL, Multi-AZ</text><line x1="290" y1="64.5" x2="440" y2="64.5" stroke="#4F8A3C" stroke-width="0.6"/><text x="294" y="75.0" font-size="8" font-family="Menlo, Consolas, monospace">primary (zone A) + standby</text><text x="294" y="86.5" font-size="8" font-family="Menlo, Consolas, monospace">(zone B), auto failover</text><text x="294" y="98.0" font-size="8" font-family="Menlo, Consolas, monospace">73 tables · 12 views</text><text x="294" y="109.5" font-size="8" font-family="Menlo, Consolas, monospace">ledger insert-only</text><rect x="290" y="150" width="130" height="31.0" rx="4" fill="#EAF0FA" stroke="#3B5C8C" stroke-width="0.8"/><text x="355.0" y="161.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">File storage (S3, versioned)</text><line x1="290" y1="164.5" x2="420" y2="164.5" stroke="#3B5C8C" stroke-width="0.6"/><text x="294" y="175.0" font-size="8" font-family="Menlo, Consolas, monospace">slips, screenshots, photos</text><rect x="290" y="205" width="130" height="42.5" rx="4" fill="#EAF0FA" stroke="#3B5C8C" stroke-width="0.8"/><text x="355.0" y="216.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">Backups</text><line x1="290" y1="219.5" x2="420" y2="219.5" stroke="#3B5C8C" stroke-width="0.6"/><text x="294" y="230.0" font-size="8" font-family="Menlo, Consolas, monospace">daily · 30 days · any minute</text><text x="294" y="241.5" font-size="8" font-family="Menlo, Consolas, monospace"> daily copy to a second region</text><rect x="460" y="40" width="170" height="31.0" rx="4" fill="#EFEFEF" stroke="#777777" stroke-width="0.8" stroke-dasharray="4 2"/><text x="545.0" y="51.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">Kraken, CoinMarketCap</text><line x1="460" y1="54.5" x2="630" y2="54.5" stroke="#777777" stroke-width="0.6"/><text x="464" y="65.0" font-size="8" font-family="Menlo, Consolas, monospace">market rates</text><rect x="460" y="90" width="170" height="31.0" rx="4" fill="#EFEFEF" stroke="#777777" stroke-width="0.8" stroke-dasharray="4 2"/><text x="545.0" y="101.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">Tronscan, Etherscan</text><line x1="460" y1="104.5" x2="630" y2="104.5" stroke="#777777" stroke-width="0.6"/><text x="464" y="115.0" font-size="8" font-family="Menlo, Consolas, monospace">hash checks</text><rect x="460" y="140" width="170" height="54.0" rx="4" fill="#EFEFEF" stroke="#777777" stroke-width="0.8" stroke-dasharray="4 2"/><text x="545.0" y="151.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">Google Sheets</text><line x1="460" y1="154.5" x2="630" y2="154.5" stroke="#777777" stroke-width="0.6"/><text x="464" y="165.0" font-size="8" font-family="Menlo, Consolas, monospace">one client journal per client;</text><text x="464" y="176.5" font-size="8" font-family="Menlo, Consolas, monospace"> the fallback workbook, refreshed</text><text x="464" y="188.0" font-size="8" font-family="Menlo, Consolas, monospace">  every 15 minutes (tenth job)</text><rect x="460" y="205" width="170" height="31.0" rx="4" fill="#EFEFEF" stroke="#777777" stroke-width="0.8" stroke-dasharray="4 2"/><text x="545.0" y="216.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">Authenticator app</text><line x1="460" y1="219.5" x2="630" y2="219.5" stroke="#777777" stroke-width="0.6"/><text x="464" y="230.0" font-size="8" font-family="Menlo, Consolas, monospace">on each user&#x27;s phone (TOTP)</text><path d="M 118.0 77.4 L 140.0 75.8" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 118.0 100.6 L 144.7 110.0" fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><path d="M 270.0 75.9 L 290.0 77.4" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 270.0 111.5 L 290.0 105.5" fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><path d="M 223.0 92.5 L 280.0 160.0 L 290.0 160.7" fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><path d="M 362.7 115.5 L 356.5 205.0" fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><path d="M 270.0 67.0 L 440.0 56.0 L 460.0 55.9" fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><path d="M 270.0 79.2 L 440.0 100.0 L 460.0 101.0" fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><path d="M 268.4 92.5 L 440.0 150.0 L 460.0 153.2" fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><path d="M 63.0 102.5 L 63.0 240.0 L 460.0 223.9" fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><text x="8" y="300" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">Recovery inside one hour (Cutover 8a): a zone failure fails over to the standby and the second task; a whole-region outage is covered by the cross-region backup copy and the runbook;</text><text x="8" y="312" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">the fallback workbook bridges the hours in between. Running cost about USD 165–245 a month (Section 6).</text></svg>