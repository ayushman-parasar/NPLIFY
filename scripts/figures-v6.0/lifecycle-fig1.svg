0 L 319.0 270.0" fill="none" stroke="#B8860B" stroke-width="1.4" marker-end="url(#arr)"/><text x="319.0" y="230.0" font-size="7" font-family="Helvetica, Arial, sans-serif" fill="#B8860B" text-anchor="middle">partner cannot pay out</text><path d="M 298.5 270.0 L 230.0 230.0 L 296.8 194.0" fill="none" stroke="#B8860B" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#arr)"/><text x="193.375" y="210.0" font-size="7" font-family="Helvetica, Arial, sans-serif" fill="#B8860B" text-anchor="middle">converted at the alternate partner</text><path d="M 571.0 194.0 L 571.0 362.0 L 504.0 362.0" fill="none" stroke="#C0622B" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><path d="M 571.0 194.0 L 571.0 350.0" fill="none" stroke="#C0622B" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><line x1="571" y1="116" x2="571" y2="144" stroke="#C00000" stroke-width="2.2"/><text x="571" y="154" font-size="7" font-family="Helvetica, Arial, sans-serif" fill="#C00000" text-anchor="middle">money landed</text><line x1="323" y1="168" x2="323" y2="196" stroke="#C00000" stroke-width="2.2"/><text x="323" y="206" font-size="7" font-family="Helvetica, Arial, sans-serif" fill="#C00000" text-anchor="middle">partner booked</text><line x1="197" y1="168" x2="197" y2="196" stroke="#C00000" stroke-width="2.2"/><text x="197" y="206" font-size="7" font-family="Helvetica, Arial, sans-serif" fill="#C00000" text-anchor="middle">partner released</text><text x="8" y="410" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">Red bars (Lifecycle 7a): after &quot;money landed&quot; only a post-money void, a reroute or a loss event remain; after &quot;partner booked&quot; the booking stands and only a variance decision,</text><text x="8" y="422" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">a reverse conversion or a reroute after conversion can move the balance; after &quot;partner released&quot; nothing is cancelled, the line ends confirmed, short or returned.</text><text x="8" y="434" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">.9. Collect-first and return legs are born at Collected; estimate-first legs enter Collecting.</text></svg>