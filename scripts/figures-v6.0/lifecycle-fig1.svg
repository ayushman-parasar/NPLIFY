ersion</text><rect x="386" y="270" width="118" height="24" rx="10" fill="#FBE3D3" stroke="#C0622B" stroke-width="0.8"/><text x="445.0" y="281.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">Rerouted (before conversion)</text><rect x="386" y="350" width="118" height="24" rx="10" fill="#FBE3D3" stroke="#C0622B" stroke-width="0.8"/><text x="445.0" y="361.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">Voided after collection</text><rect x="512" y="350" width="118" height="24" rx="10" fill="#FBE3D3" stroke="#C0622B" stroke-width="0.8"/><text x="571.0" y="361.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">Loss event: NPL stands in</text><path d="M 126.0 62.0 L 134.0 62.0" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 252.0 62.0 L 260.0 62.0" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 378.0 62.0 L 386.0 62.0" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 504.0 62.0 L 512.0 62.0" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 571.0 74.0 L 571.0 170.0" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><text x="617.0" y="119.0" font-size="7" font-family="Helvetica, Arial, sans-serif" fill="#555" text-anchor="middle">all parts verified</text><path d="M 512.0 182.0 L 504.0 182.0" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><text x="508.0" y="178.0" font-size="7" font-family="Helvetica, Arial, sans-serif" fill="#555" text-anchor="middle">instruct</text><path d="M 571.0 194.0 L 571.0 250.0" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><text x="627.0" y="219.0" font-size="7" font-family="Helvetica, Arial, sans-serif" fill="#555" text-anchor="middle">bank-channel pair</text><path d="M 512.0 262.0 L 445.0 262.0 L 445.0 194.0"