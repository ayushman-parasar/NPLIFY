2" marker-end="url(#arr)"/><path d="M 170.0 251.2 L 162.0 250.0 L 105.9 184.0" fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><path d="M 322.0 138.4 L 240.0 118.0 L 158.0 138.4" fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><path d="M 484.0 147.7 L 400.0 118.0 L 158.0 147.8" fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><text x="8" y="312" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">Change control unchanged: Finance proposes, Management approves; every row is versioned by effective date. New (1a): a project is created from an archetype,</text><text x="8" y="324" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">passes the Section 6 rules to become validated, and prices deals only when active; the four effective-date rules say which versions a deal keeps.</text></svg>