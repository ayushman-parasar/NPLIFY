<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="100%" style="display:block; background:#FFFFFF; border:0.5pt solid #bbbbbb"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs><text x="6" y="14" font-size="10" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-weight="bold">Figure 1 — the cutover in six steps, with opening entries in place of the backfill</text><rect x="8" y="50" width="118" height="42.5" rx="6" fill="#EAF0FA" stroke="#3B5C8C" stroke-width="0.8"/><text x="67.0" y="61.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">0 · Prepare</text><line x1="8" y1="64.5" x2="126" y2="64.5" stroke="#3B5C8C" stroke-width="0.6"/><text x="12" y="75.0" font-size="8" font-family="Menlo, Consolas, monospace">configuration, users,</text><text x="12" y="86.5" font-size="8" font-family="Menlo, Consolas, monospace">dummy test projects</text><rect x="134" y="50" width="118" height="42.5" rx="6" fill="#EAF0FA" stroke="#3B5C8C" stroke-width="0.8"/><text x="193.0" y="61.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">1 · Opening date</text><line x1="134" y1="64.5" x2="252" y2="64.5" stroke="#3B5C8C" stroke-width="0.6"/><text x="138" y="75.0" font-size="8" font-family="Menlo, Consolas, monospace">verified opening entries;</text><text x="138" y="86.5" font-size="8" font-family="Menlo, Consolas, monospace">in-flight deals entered</text><rect x="260" y="50" width="118" height="54.0" rx="6" fill="#EAF0FA" stroke="#3B5C8C" stroke-width="0.8"/><text x="319.0" y="61.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">2 · Parallel run</text><line x1="260" y1="64.5" x2="378" y2="64.5" stroke="#3B5C8C" stroke-width="0.6"/><text x="264" y="75.0" font-size="8" font-family="Menlo, Consolas, monospace">3–4 weeks on staging;</text><text x="264" y="86.5" font-size="8" font-family="Menlo, Consolas, monospace">sheets lead, app follows;</text><text x="264" y="98.0" font-size="8" font-family="Menlo, Consolas, monospace">daily reconciliation</text><rect x="386" y="50" width="118" height="42.5" rx="6" fill="#EAF0FA" stroke="#3B5C8C" stroke-width="0.8"/><text x="445.0" y="61.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">3 · Go / no-go</text><line x1="386" y1="64.5" x2="504" y2="64.5" stroke="#3B5C8C" stroke-width="0.6"/><text x="390" y="75.0" font-size="8" font-family="Menlo, Consolas, monospace">exit criteria 1 to 13;</text><text x="390" y="86.5" font-size="8" font-family="Menlo, Consolas, monospace">Management signs</text><rect x="512" y="50" width="118" height="42.5" rx="6" fill="#EAF0FA" stroke="#3B5C8C" stroke-width="0.8"/><text x="571.0" y="61.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">4 · Switch day</text><line x1="512" y1="64.5" x2="630" y2="64.5" stroke="#3B5C8C" stroke-width="0.6"/><text x="516" y="75.0" font-size="8" font-family="Menlo, Consolas, monospace">extract real projects,</text><text x="516" y="86.5" font-size="8" font-family="Menlo, Consolas, monospace">copy, verify, switch</text><rect x="260" y="160" width="118" height="42.5" rx="6" fill="#E6E6E6" stroke="#555555" stroke-width="0.8"/><text x="319.0" y="171.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">5 · First live day</text><line x1="260" y1="174.5" x2="378" y2="174.5" stroke="#555555" stroke-width="0.6"/><text x="264" y="185.0" font-size="8" font-family="Menlo, Consolas, monospace">workbook export running;</text><text x="264" y="196.5" font-size="8" font-family="Menlo, Consolas, monospace">sheets read-only</text><rect x="386" y="160" width="244" height="42.5" rx="6" fill="#E6E6E6" stroke="#555555" stroke-width="0.8"/><text x="508.0" y="171.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">After</text><line x1="386" y1="174.5" x2="630" y2="174.5" stroke="#555555" stroke-width="0.6"/><text x="390" y="185.0" font-size="8" font-family="Menlo, Consolas, monospace">Multi-AZ, two tasks, cross-region</text><text x="390" y="196.5" font-size="8" font-family="Menlo, Consolas, monospace">copy live; 8a runbook rehearsed</text><path d="M 126.0 71.2 L 134.0 71.2" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 252.0 73.9 L 260.0 74.3" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 378.0 74.3 L 386.0 73.9" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 504.0 71.2 L 512.0 71.2" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 571.0 92.5 L 571.0 185.0 L 378.0 182.1" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 378.0 181.2 L 386.0 181.2" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><text x="8" y="128" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#666" text-anchor="start">week 0</text><text x="134" y="128" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#666" text-anchor="start">day 1 of the run</text><text x="260" y="128" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#666" text-anchor="start">weeks 1–4</text><text x="386" y="128" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#666" text-anchor="start">S − 2 days</text><text x="512" y="128" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#666" text-anchor="start">S (switch day)</text><text x="8" y="250" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">Changed since v5.9: the backfill of earlier deals is gone; the balances of the opening date enter as verified opening entries (Section 4, Ledger Pattern R), so NPL chooses its</text><text x="8" y="262" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">opening date rather than waiting for a clean break. Scripted test deals live in flagged dummy projects that the extract leaves behind (Section 3). Only steps 3 and 4 touch production.</text></svg>