nsolas, monospace">kind partner_suspend /</text><text x="334" y="376.5" font-size="8" font-family="Menlo, Consolas, monospace">  destination_freeze /</text><text x="334" y="388.0" font-size="8" font-family="Menlo, Consolas, monospace">  cutoff_override</text><text x="334" y="399.5" font-size="8" font-family="Menlo, Consolas, monospace">subject_type + subject_id</text><text x="334" y="411.0" font-size="8" font-family="Menlo, Consolas, monospace">applied_by → (Finance),</text><text x="334" y="422.5" font-size="8" font-family="Menlo, Consolas, monospace">applied_at</text><text x="334" y="434.0" font-size="8" font-family="Menlo, Consolas, monospace">ratified_by → (Management)</text><text x="334" y="445.5" font-size="8" font-family="Menlo, Consolas, monospace">lifted_at, state</text><rect x="490" y="340" width="168" height="88.5" rx="4" fill="#EFEFEF" stroke="#777777" stroke-width="0.8" stroke-dasharray="4 2"/><text x="574.0" y="351.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">12 derived views (never stored)</text><line x1="490" y1="354.5" x2="658" y2="354.5" stroke="#777777" stroke-width="0.6"/><text x="494" y="365.0" font-size="8" font-family="Menlo, Consolas, monospace">PROJECT_BALANCE, GROUP_ENTITLEMENT</text><text x="494" y="376.5" font-size="8" font-family="Menlo, Consolas, monospace">OFFSET, CUSTODY, INVOICE_BALANCE</text><text x="494" y="388.0" font-size="8" font-family="Menlo, Consolas, monospace">PROJECT_MONTH_VOLUME</text><text x="494" y="399.5" font-size="8" font-family="Menlo, Consolas, monospace">CLIENT_POSITION, WALLET_REGISTRY</text><text x="494" y="411.0" font-size="8" font-family="Menlo, Consolas, monospace">REPORTING_VALUE, RESELLER_MARGIN</text><text x="494" y="422.5" font-size="8" font-family="Menlo, Consolas, monospace">REMITTANCE_MARGIN, NPL_PROFIT</text><path d="M 250.0 80.7 L 160.0 76.3" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 400.0 82.5 L 490.0 80.3" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 89.1 150.0 L 90.0 140.0 L 87.4 105.5" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><text x="128.7174721189591" y="119.75" font-size="7" font-family="Helvetica, Arial, sans-serif" fill="#555" text-anchor="middle">posts one</text><path d="M 329.1 150.0 L 330.0 140.0 L 160.0 93.3" fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><text x="265.0" y="113.66836734693878" font-size="7" font-family="Helvetica, Arial, sans-serif" fill="#555" text-anchor="middle">true-up</text><path d="M 160.0 268.6 L 170.0 268.2" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 330.0 271.6 L 320.0 270.9" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 490.0 274.3 L 330.0 244.0 L 160.0 262.9" fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><path d="M 170.0 396.8 L 160.0 400.0 L 97.4 292.5" fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><path d="M 330.0 425.7 L 300.0 440.0 L 112.1 292.5" fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><path d="M 580.8 340.0 L 620.0 230.0 L 400.0 121.3" fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><text x="470.0" y="172.65254237288136" font-size="7" font-family="Helvetica, Arial, sans-serif" fill="#555" text-anchor="middle">sums over postings</text><text x="10" y="520" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">Rules at database level (Appendix C): postings balance per currency and per owner; ledger and audit tables accept inserts only; every PAYABLE line carries its receiver group;</text><text x="10" y="532" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">the seven type-plus-id references are checked by one generic trigger; the approver&#x27;s person_ref differs from the initiator&#x27;s; versioned configuration is write-once.</text><text x="10" y="544" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">Recent additions: OPENING_ENTRY (Pattern R), PARTNER_STATEMENT_RECONCILIATION (Pattern Q), EMERGENCY_ACTION (Lifecycle §5),</text><text x="10" y="556" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">TYPE_REGISTRY (Appendix C, round 2), and the new fields.</text><rect x="10" y="574" width="12" height="9" fill="#DDEFD6" stroke="#4F8A3C" stroke-width="0.8"/><text x="26" y="582" font-size="7" font-family="Helvetica, Arial, sans-serif">ledger &amp; control</text><rect x="160" y="574" width="12" height="9" fill="#EFEFEF" stroke="#777777" stroke-width="0.8"/><text x="176" y="582" font-size="7" font-family="Helvetica, Arial, sans-serif">derived view (never stored)</text><g class="rev"><rect x="7" y="417" width="156" height="71.5" rx="5" fill="#ffe58a"/></g><rect x="10" y="420" width="150" height="65.5" rx="4" fill="#DDEFD6" stroke="#4F8A3C" stroke-width="0.8"/><text x="85.0" y="431.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">TYPE_REGISTRY (new)</text><line x1="10" y1="434.5" x2="160" y2="434.5" stroke="#4F8A3C" stroke-width="0.6"/><text x="14" y="445.0" font-size="8" font-family="Menlo, Consolas, monospace">reference, type_value</text><text x="14" y="456.5" font-size="8" font-family="Menlo, Consolas, monospace">table_name, project_column</text><text x="14" y="468.0" font-size="8" font-family="Menlo, Consolas, monospace">critical, status</text><text x="14" y="479.5" font-size="8" font-family="Menlo, Consolas, monospace">approved_by → (Management)</text><text x="170" y="455" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">TYPE_REGISTRY: the type values the generic trigger accepts for the seven type-plus-id</text><text x="170" y="467" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">references (Appendix C): type value → table name → project column; Management approves a new value.</text></svg>