<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="100%" style="display:block; background:#FFFFFF; border:0.5pt solid #bbbbbb"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs><text x="6" y="14" font-size="10" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-weight="bold">Diagram 2 — rates</text><rect x="10" y="40" width="150" height="19.5" rx="4" fill="#EFEFEF" stroke="#777777" stroke-width="0.8" stroke-dasharray="4 2"/><text x="85.0" y="51.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">CURRENCY_PAIR (1a)</text><rect x="170" y="40" width="150" height="19.5" rx="4" fill="#EFEFEF" stroke="#777777" stroke-width="0.8" stroke-dasharray="4 2"/><text x="245.0" y="51.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">RATE_SOURCE (1a)</text><rect x="330" y="40" width="150" height="31.0" rx="4" fill="#EFEFEF" stroke="#777777" stroke-width="0.8" stroke-dasharray="4 2"/><text x="405.0" y="51.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">PAIR_RATE_SOURCE (1a)</text><line x1="330" y1="54.5" x2="480" y2="54.5" stroke="#777777" stroke-width="0.6"/><text x="334" y="65.0" font-size="8" font-family="Menlo, Consolas, monospace">the chain, by priority</text><rect x="490" y="40" width="150" height="19.5" rx="4" fill="#EFEFEF" stroke="#777777" stroke-width="0.8" stroke-dasharray="4 2"/><text x="565.0" y="51.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">PARTNER_PAIR (1b)</text><rect x="10" y="110" width="150" height="65.5" rx="4" fill="#D8F0EC" stroke="#2E8B7A" stroke-width="0.8"/><text x="85.0" y="121.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">MARKET_RATE</text><line x1="10" y1="124.5" x2="160" y2="124.5" stroke="#2E8B7A" stroke-width="0.6"/><text x="14" y="135.0" font-size="8" font-family="Menlo, Consolas, monospace">rate_source_id →</text><text x="14" y="146.5" font-size="8" font-family="Menlo, Consolas, monospace">currency_pair_id →</text><text x="14" y="158.0" font-size="8" font-family="Menlo, Consolas, monospace">rate, captured_at</text><text x="14" y="169.5" font-size="8" font-family="Menlo, Consolas, monospace">stale (past threshold)</text><rect x="250" y="110" width="150" height="65.5" rx="4" fill="#D8F0EC" stroke="#2E8B7A" stroke-width="0.8"/><text x="325.0" y="121.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">RATE_COMPARISON</text><line x1="250" y1="124.5" x2="400" y2="124.5" stroke="#2E8B7A" stroke-width="0.6"/><text x="254" y="135.0" font-size="8" font-family="Menlo, Consolas, monospace">partner_pair_id →</text><text x="254" y="146.5" font-size="8" font-family="Menlo, Consolas, monospace">date (one per pair × day)</text><text x="254" y="158.0" font-size="8" font-family="Menlo, Consolas, monospace">avg_spread_2w, avg_spread_4w</text><text x="254" y="169.5" font-size="8" font-family="Menlo, Consolas, monospace">status open / closed</text><rect x="450" y="110" width="150" height="88.5" rx="4" fill="#D8F0EC" stroke="#2E8B7A" stroke-width="0.8"/><text x="525.0" y="121.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">PARTNER_RATE_VERSION</text><line x1="450" y1="124.5" x2="600" y2="124.5" stroke="#2E8B7A" stroke-width="0.6"/><text x="454" y="135.0" font-size="8" font-family="Menlo, Consolas, monospace">rate_comparison_id →</text><text x="454" y="146.5" font-size="8" font-family="Menlo, Consolas, monospace">quoted_rate, quoted_direction</text><text x="454" y="158.0" font-size="8" font-family="Menlo, Consolas, monospace">rate (normalised), location</text><text x="454" y="169.5" font-size="8" font-family="Menlo, Consolas, monospace">market_rate_id →, spread_pct</text><text x="454" y="181.0" font-size="8" font-family="Menlo, Consolas, monospace">status active/usable/breached/</text><text x="454" y="192.5" font-size="8" font-family="Menlo, Consolas, monospace">  approved/rejected/expired</text><path d="M 85.0 110.0 L 85.0 59.5" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 142.5 110.0 L 160.0 100.0 L 228.5 59.5" fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><path d="M 382.5 110.0 L 400.0 100.0 L 533.0 59.5" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 450.0 149.9 L 400.0 147.1" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 450.0 183.4 L 330.0 230.0 L 160.0 169.5" fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><text x="245.0" y="196.7295918367347" font-size="7" font-family="Helvetica, Arial, sans-serif" fill="#555" text-anchor="middle">snapshot used</text><text x="10" y="250" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">Breach check (Calculation Specification §2 and 2a): spread = 1 − partner_rate ÷ market_rate; breach when spread &gt; avg_2w × (1 + variance_threshold_rel).</text><text x="10" y="262" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">New rules 2a: with fewer than rate_min_observations confirmed versions, or a zero or negative baseline, the fallback threshold rate_fallback_spread_abs applies;</text><text x="10" y="274" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">a spread beyond rate_abs_tolerance from the average in either direction is flagged for Finance. The three values are THRESHOLD kinds (diagram 1a).</text><rect x="10" y="292" width="12" height="9" fill="#D8F0EC" stroke="#2E8B7A" stroke-width="0.8"/><text x="26" y="300" font-size="7" font-family="Helvetica, Arial, sans-serif">rate reference</text><rect x="160" y="292" width="12" height="9" fill="#EFEFEF" stroke="#777777" stroke-width="0.8"/><text x="176" y="300" font-size="7" font-family="Helvetica, Arial, sans-serif">derived view (never stored)</text></svg>