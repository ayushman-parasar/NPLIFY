Consolas, monospace">network, address</text><text x="14" y="401.0" font-size="8" font-family="Menlo, Consolas, monospace">custody_max_hours</text><text x="170" y="345" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">Rules: every project belongs to one client; a project prices deals only when active;</text><text x="170" y="357" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">configuration rows are versioned by effective_from, never edited; Management approves changes.</text><text x="170" y="375" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">New since v5.9: PROJECT.state and is_test; THRESHOLD kinds for approval time limits,</text><text x="170" y="387" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">cutoff warnings, lock idle time and the three breach-rule values.</text><g class="rev"><rect x="168" y="391" width="468" height="23" fill="#ffe58a"/></g><text x="170" y="399" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">Email OTP: PROJECT the switch; each SENDER (1b) its approver email and chat group; THRESHOLD the code window,</text><text x="170" y="411" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">the step-up amount and the tripwire; the approval record itself, CUSTOMER_APPROVAL, is in Appendix B.3.</text><path d="M 84.0 204.0 L 84.0 199.0 L 5.0 199.0 L 5.0 67.0 L 10.0 67.0" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><text x="0" y="0" transform="translate(3.5,145) rotate(-90)" font-size="7" font-family="Helvetica, Arial, sans-serif" fill="#555" text-anchor="middle">belongs to</text><path d="M 330.0 66.6 L 318.0 67.4" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#