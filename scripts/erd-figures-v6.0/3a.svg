<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="100%" style="display:block; background:#FFFFFF; border:0.5pt solid #bbbbbb"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs><text x="6" y="14" font-size="10" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-weight="bold">Diagram 3a — the deal: group, legs, quote, collection</text><rect x="10" y="40" width="150" height="88.5" rx="4" fill="#FDE4C8" stroke="#C8782A" stroke-width="0.8"/><text x="85.0" y="51.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">DEAL_GROUP</text><line x1="10" y1="54.5" x2="160" y2="54.5" stroke="#C8782A" stroke-width="0.6"/><text x="14" y="65.0" font-size="8" font-family="Menlo, Consolas, monospace">project_id →, sender_id →</text><text x="14" y="76.5" font-size="8" font-family="Menlo, Consolas, monospace">receiver_group_id →</text><text x="14" y="88.0" font-size="8" font-family="Menlo, Consolas, monospace">entry_mode, client_ref</text><text x="14" y="99.5" font-size="8" font-family="Menlo, Consolas, monospace">fee_structure_id → (stamped)</text><text x="14" y="111.0" font-size="8" font-family="Menlo, Consolas, monospace">sender_rate, amount_in, target_out</text><text x="14" y="122.5" font-size="8" font-family="Menlo, Consolas, monospace">invoice_id →, invoice_amount</text><rect x="250" y="40" width="150" height="100.0" rx="4" fill="#FDE4C8" stroke="#C8782A" stroke-width="0.8"/><text x="325.0" y="51.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">DEAL (one leg)</text><line x1="250" y1="54.5" x2="400" y2="54.5" stroke="#C8782A" stroke-width="0.6"/><text x="254" y="65.0" font-size="8" font-family="Menlo, Consolas, monospace">deal_group_id →, leg_no</text><text x="254" y="76.5" font-size="8" font-family="Menlo, Consolas, monospace">leg_type forward / return</text><text x="254" y="88.0" font-size="8" font-family="Menlo, Consolas, monospace">funding_source + funding_ref_id</text><text x="254" y="99.5" font-size="8" font-family="Menlo, Consolas, monospace">partner_entity_id →</text><text x="254" y="111.0" font-size="8" font-family="Menlo, Consolas, monospace">priced_at, quote clocks (write-once)</text><text x="254" y="122.5" font-size="8" font-family="Menlo, Consolas, monospace">rate_locked_at, conversion_due_date</text><text x="254" y="134.0" font-size="8" font-family="Menlo, Consolas, monospace">state</text><rect x="490" y="40" width="150" height="54.0" rx="4" fill="#FDE4C8" stroke="#C8782A" stroke-width="0.8"/><text x="565.0" y="51.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">INVOICE (NPL-GR)</text><line x1="490" y1="54.5" x2="640" y2="54.5" stroke="#C8782A" stroke-width="0.6"/><text x="494" y="65.0" font-size="8" font-family="Menlo, Consolas, monospace">project_id →, kind vendor / resale</text><text x="494" y="76.5" font-size="8" font-family="Menlo, Consolas, monospace">vendor_invoice_id →</text><text x="494" y="88.0" font-size="8" font-family="Menlo, Consolas, monospace">amount, currency, status</text><rect x="10" y="200" width="150" height="65.5" rx="4" fill="#FDE4C8" stroke="#C8782A" stroke-width="0.8"/><text x="85.0" y="211.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">QUOTE_PACKAGE</text><line x1="10" y1="214.5" x2="160" y2="214.5" stroke="#C8782A" stroke-width="0.6"/><text x="14" y="225.0" font-size="8" font-family="Menlo, Consolas, monospace">deal_id →, issue_no</text><text x="14" y="236.5" font-size="8" font-family="Menlo, Consolas, monospace">message_template_id →</text><text x="14" y="248.0" font-size="8" font-family="Menlo, Consolas, monospace">sent_at, quote_hash</text><text x="14" y="259.5" font-size="8" font-family="Menlo, Consolas, monospace">superseded_by_id →</text><rect x="170" y="200" width="150" height="54.0" rx="4" fill="#FDE4C8" stroke="#C8782A" stroke-width="0.8"/><text x="245.0" y="211.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">QUOTE_VALIDITY_EXTENSION</text><line x1="170" y1="214.5" x2="320" y2="214.5" stroke="#C8782A" stroke-width="0.6"/><text x="174" y="225.0" font-size="8" font-family="Menlo, Consolas, monospace">deal_id →, extension_no</text><text x="174" y="236.5" font-size="8" font-family="Menlo, Consolas, monospace">to_valid_until</text><text x="174" y="248.0" font-size="8" font-family="Menlo, Consolas, monospace">approval_id →</text><rect x="330" y="200" width="150" height="42.5" rx="4" fill="#FDE4C8" stroke="#C8782A" stroke-width="0.8"/><text x="405.0" y="211.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">DEAL_FEE_TIER</text><line x1="330" y1="214.5" x2="480" y2="214.5" stroke="#C8782A" stroke-width="0.6"/><text x="334" y="225.0" font-size="8" font-family="Menlo, Consolas, monospace">deal_id →, fee_tier_id →</text><text x="334" y="236.5" font-size="8" font-family="Menlo, Consolas, monospace">portion_amount, pct</text><rect x="490" y="200" width="150" height="42.5" rx="4" fill="#FDE4C8" stroke="#C8782A" stroke-width="0.8"/><text x="565.0" y="211.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">SENDER_CREDIT</text><line x1="490" y1="214.5" x2="640" y2="214.5" stroke="#C8782A" stroke-width="0.6"/><text x="494" y="225.0" font-size="8" font-family="Menlo, Consolas, monospace">sender_id →, deal_id →</text><text x="494" y="236.5" font-size="8" font-family="Menlo, Consolas, monospace">amount, state open / applied</text><rect x="10" y="300" width="150" height="88.5" rx="4" fill="#FDE4C8" stroke="#C8782A" stroke-width="0.8"/><text x="85.0" y="311.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">COLLECTION</text><line x1="10" y1="314.5" x2="160" y2="314.5" stroke="#C8782A" stroke-width="0.6"/><text x="14" y="325.0" font-size="8" font-family="Menlo, Consolas, monospace">deal_id →</text><text x="14" y="336.5" font-size="8" font-family="Menlo, Consolas, monospace">collection_receiving_endpoint_id →</text><text x="14" y="348.0" font-size="8" font-family="Menlo, Consolas, monospace">collection_sending_entity_id →</text><text x="14" y="359.5" font-size="8" font-family="Menlo, Consolas, monospace">amount, tx_hash / token_ref</text><text x="14" y="371.0" font-size="8" font-family="Menlo, Consolas, monospace">wallet_screening_id →</text><text x="14" y="382.5" font-size="8" font-family="Menlo, Consolas, monospace">state, verified_by →, verified_at</text><rect x="170" y="300" width="150" height="54.0" rx="4" fill="#EFEFEF" stroke="#777777" stroke-width="0.8" stroke-dasharray="4 2"/><text x="245.0" y="311.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">SENDER / RECEIVER_GROUP /</text><line x1="170" y1="314.5" x2="320" y2="314.5" stroke="#777777" stroke-width="0.6"/><text x="174" y="325.0" font-size="8" font-family="Menlo, Consolas, monospace">PARTNER_ENTITY / FEE_STRUCTURE /</text><text x="174" y="336.5" font-size="8" font-family="Menlo, Consolas, monospace">COLLECTION_RECEIVING_ENDPOINT</text><text x="174" y="348.0" font-size="8" font-family="Menlo, Consolas, monospace">(diagrams 1a, 1b)</text><rect x="490" y="300" width="150" height="31.0" rx="4" fill="#EFEFEF" stroke="#777777" stroke-width="0.8" stroke-dasharray="4 2"/><text x="565.0" y="311.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">PARTNER_RATE_VERSION (2)</text><line x1="490" y1="314.5" x2="640" y2="314.5" stroke="#777777" stroke-width="0.6"/><text x="494" y="325.0" font-size="8" font-family="Menlo, Consolas, monospace">stamped on the leg at pricing</text><path d="M 250.0 88.2 L 160.0 86.0" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 160.0 67.6 L 330.0 30.0 L 490.0 55.2" fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><text x="410.0" y="39.59574468085106" font-size="7" font-family="Helvetica, Arial, sans-serif" fill="#555" text-anchor="middle">collects</text><path d="M 114.7 200.0 L 160.0 150.0 L 250.0 117.3" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 260.8 200.0 L 295.8 140.0" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 392.0 200.0 L 355.5 140.0" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 563.5 200.0 L 560.0 150.0 L 400.0 109.1" fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><path d="M 87.3 300.0 L 90.0 250.0 L 251.6 140.0" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 160.0 338.9 L 170.0 336.0" fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><path d="M 400.0 121.9 L 560.0 190.0 L 564.4 300.0" fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><text x="10" y="420" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">Rules: pricing fields are write-once after priced_at; a collect-first or return leg is born at Collected; a leg&#x27;s partner and partner entity change only by a REROUTE (3b);</text><text x="10" y="432" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">the effective-date rules (Configuration Schema 1a) say which versions a leg stamps. Round 2 adds CUSTOMER_APPROVAL; nothing else changed.</text><rect x="10" y="448" width="12" height="9" fill="#FDE4C8" stroke="#C8782A" stroke-width="0.8"/><text x="26" y="456" font-size="7" font-family="Helvetica, Arial, sans-serif">transactional event</text><rect x="160" y="448" width="12" height="9" fill="#EFEFEF" stroke="#777777" stroke-width="0.8"/><text x="176" y="456" font-size="7" font-family="Helvetica, Arial, sans-serif">derived view (never stored)</text><g class="rev"><rect x="327" y="297" width="156" height="71.5" rx="5" fill="#ffe58a"/></g><rect x="330" y="300" width="150" height="65.5" rx="4" fill="#FDE4C8" stroke="#C8782A" stroke-width="0.8"/><text x="405.0" y="311.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">CUSTOMER_APPROVAL</text><line x1="330" y1="314.5" x2="480" y2="314.5" stroke="#4A6FA5" stroke-width="0.6"/><text x="334" y="325.0" font-size="8" font-family="Menlo, Consolas, monospace">quote_package_id →, issue_no</text><text x="334" y="336.5" font-size="8" font-family="Menlo, Consolas, monospace">approver_email, code_hash</text><text x="334" y="348.0" font-size="8" font-family="Menlo, Consolas, monospace">sent_at, expires_at</text><text x="334" y="359.5" font-size="8" font-family="Menlo, Consolas, monospace">decision, decided_at, evidence</text><path d="M 405.0 300.0 L 405.0 282.0 L 160.0 258.0" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><text x="300" y="277" font-size="7" font-family="Helvetica, Arial, sans-serif" fill="#555" text-anchor="middle">approves one issue</text><g class="rev"><rect x="328" y="371" width="156" height="23" fill="#ffe58a"/></g><text x="330" y="379" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">Round 2 (Email OTP): the customer's code</text><text x="330" y="391" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">per quote issue; full fields in Appendix B.3.</text></svg>