<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="100%" style="display:block; background:#FFFFFF; border:0.5pt solid #bbbbbb"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs><text x="6" y="14" font-size="10" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-weight="bold">Diagram 3c — settlement and what follows it</text><rect x="10" y="40" width="150" height="88.5" rx="4" fill="#FDE4C8" stroke="#C8782A" stroke-width="0.8"/><text x="85.0" y="51.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">SETTLEMENT</text><line x1="10" y1="54.5" x2="160" y2="54.5" stroke="#C8782A" stroke-width="0.6"/><text x="14" y="65.0" font-size="8" font-family="Menlo, Consolas, monospace">project_id →</text><text x="14" y="76.5" font-size="8" font-family="Menlo, Consolas, monospace">settlement_sending_entity_id →</text><text x="14" y="88.0" font-size="8" font-family="Menlo, Consolas, monospace">settlement_rail_id →</text><text x="14" y="99.5" font-size="8" font-family="Menlo, Consolas, monospace">currency, total</text><text x="14" y="111.0" font-size="8" font-family="Menlo, Consolas, monospace">state, released_at</text><text x="14" y="122.5" font-size="8" font-family="Menlo, Consolas, monospace">prepared/approved/escalated →</text><rect x="250" y="40" width="150" height="111.5" rx="4" fill="#FDE4C8" stroke="#C8782A" stroke-width="0.8"/><text x="325.0" y="51.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">SETTLEMENT_LINE</text><line x1="250" y1="54.5" x2="400" y2="54.5" stroke="#C8782A" stroke-width="0.6"/><text x="254" y="65.0" font-size="8" font-family="Menlo, Consolas, monospace">settlement_id →, deal_id →</text><text x="254" y="76.5" font-size="8" font-family="Menlo, Consolas, monospace">destination_approval_id →</text><text x="254" y="88.0" font-size="8" font-family="Menlo, Consolas, monospace">amount, reference</text><text x="254" y="99.5" font-size="8" font-family="Menlo, Consolas, monospace">outcome sent/confirmed/short/returned</text><text x="254" y="111.0" font-size="8" font-family="Menlo, Consolas, monospace">released_at</text><text x="254" y="122.5" font-size="8" font-family="Menlo, Consolas, monospace">expected_confirmation_by</text><text x="254" y="134.0" font-size="8" font-family="Menlo, Consolas, monospace">confirmed_at</text><text x="254" y="145.5" font-size="8" font-family="Menlo, Consolas, monospace">invoice_id →, discharge_rate</text><rect x="490" y="40" width="150" height="65.5" rx="4" fill="#FDE4C8" stroke="#C8782A" stroke-width="0.8"/><text x="565.0" y="51.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">CONFIRMATION</text><line x1="490" y1="54.5" x2="640" y2="54.5" stroke="#C8782A" stroke-width="0.6"/><text x="494" y="65.0" font-size="8" font-family="Menlo, Consolas, monospace">settlement_line_id →</text><text x="494" y="76.5" font-size="8" font-family="Menlo, Consolas, monospace">result full / short</text><text x="494" y="88.0" font-size="8" font-family="Menlo, Consolas, monospace">amount_received</text><text x="494" y="99.5" font-size="8" font-family="Menlo, Consolas, monospace">confirmed_by →, confirmed_at</text><rect x="490" y="140" width="150" height="54.0" rx="4" fill="#FDE4C8" stroke="#C8782A" stroke-width="0.8"/><text x="565.0" y="151.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">SETTLEMENT_RETURN</text><line x1="490" y1="154.5" x2="640" y2="154.5" stroke="#C8782A" stroke-width="0.6"/><text x="494" y="165.0" font-size="8" font-family="Menlo, Consolas, monospace">settlement_line_id →</text><text x="494" y="176.5" font-size="8" font-family="Menlo, Consolas, monospace">returned_amount, bank_fee</text><text x="494" y="188.0" font-size="8" font-family="Menlo, Consolas, monospace">reason, returned_at</text><rect x="490" y="220" width="150" height="54.0" rx="4" fill="#FDE4C8" stroke="#C8782A" stroke-width="0.8"/><text x="565.0" y="231.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">SHORTFALL</text><line x1="490" y1="234.5" x2="640" y2="234.5" stroke="#C8782A" stroke-width="0.6"/><text x="494" y="245.0" font-size="8" font-family="Menlo, Consolas, monospace">confirmation_id →</text><text x="494" y="256.5" font-size="8" font-family="Menlo, Consolas, monospace">amount, state</text><text x="494" y="268.0" font-size="8" font-family="Menlo, Consolas, monospace">topped_up_settlement_id →</text><rect x="10" y="200" width="150" height="65.5" rx="4" fill="#FDE4C8" stroke="#C8782A" stroke-width="0.8"/><text x="85.0" y="211.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">BANK_FEE_EVENT</text><line x1="10" y1="214.5" x2="160" y2="214.5" stroke="#C8782A" stroke-width="0.6"/><text x="14" y="225.0" font-size="8" font-family="Menlo, Consolas, monospace">settlement_id →</text><text x="14" y="236.5" font-size="8" font-family="Menlo, Consolas, monospace">expected_amount, actual_amount</text><text x="14" y="248.0" font-size="8" font-family="Menlo, Consolas, monospace">treatment waived / carry_forward /</text><text x="14" y="259.5" font-size="8" font-family="Menlo, Consolas, monospace">  absorbed, state</text><rect x="250" y="220" width="150" height="54.0" rx="4" fill="#FDE4C8" stroke="#C8782A" stroke-width="0.8"/><text x="325.0" y="231.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">FEE_DECISION</text><line x1="250" y1="234.5" x2="400" y2="234.5" stroke="#C8782A" stroke-width="0.6"/><text x="254" y="245.0" font-size="8" font-family="Menlo, Consolas, monospace">subject_type + subject_id</text><text x="254" y="256.5" font-size="8" font-family="Menlo, Consolas, monospace">fee_kind, decision, pct</text><text x="254" y="268.0" font-size="8" font-family="Menlo, Consolas, monospace">recommended_by →, approved_by →</text><rect x="10" y="300" width="150" height="54.0" rx="4" fill="#FDE4C8" stroke="#C8782A" stroke-width="0.8"/><text x="85.0" y="311.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">MARKUP_SHARE_ACCRUAL</text><line x1="10" y1="314.5" x2="160" y2="314.5" stroke="#C8782A" stroke-width="0.6"/><text x="14" y="325.0" font-size="8" font-family="Menlo, Consolas, monospace">deal_id →, markup_share_rule_id →</text><text x="14" y="336.5" font-size="8" font-family="Menlo, Consolas, monospace">amount, direction</text><text x="14" y="348.0" font-size="8" font-family="Menlo, Consolas, monospace">state, period, paid_at</text><rect x="250" y="310" width="150" height="54.0" rx="4" fill="#FDE4C8" stroke="#C8782A" stroke-width="0.8"/><text x="325.0" y="321.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">PARTNER_REBATE_ACCRUAL</text><line x1="250" y1="324.5" x2="400" y2="324.5" stroke="#C8782A" stroke-width="0.6"/><text x="254" y="335.0" font-size="8" font-family="Menlo, Consolas, monospace">partner_rebate_rule_id →, deal_id →</text><text x="254" y="346.5" font-size="8" font-family="Menlo, Consolas, monospace">expected_amount, received_amount</text><text x="254" y="358.0" font-size="8" font-family="Menlo, Consolas, monospace">state, statement_ref</text><rect x="10" y="380" width="150" height="54.0" rx="4" fill="#FDE4C8" stroke="#C8782A" stroke-width="0.8"/><text x="85.0" y="391.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">LOSS_EVENT</text><line x1="10" y1="394.5" x2="160" y2="394.5" stroke="#C8782A" stroke-width="0.6"/><text x="14" y="405.0" font-size="8" font-family="Menlo, Consolas, monospace">side + collection_id → |</text><text x="14" y="416.5" font-size="8" font-family="Menlo, Consolas, monospace">  settlement_line_id →</text><text x="14" y="428.0" font-size="8" font-family="Menlo, Consolas, monospace">amount, shares, state</text><rect x="250" y="390" width="150" height="54.0" rx="4" fill="#FDE4C8" stroke="#C8782A" stroke-width="0.8"/><text x="325.0" y="401.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">LOSS_RECOVERY</text><line x1="250" y1="404.5" x2="400" y2="404.5" stroke="#C8782A" stroke-width="0.6"/><text x="254" y="415.0" font-size="8" font-family="Menlo, Consolas, monospace">loss_event_id →, party</text><text x="254" y="426.5" font-size="8" font-family="Menlo, Consolas, monospace">amount, state agreed / received</text><text x="254" y="438.0" font-size="8" font-family="Menlo, Consolas, monospace">approved_by →</text><rect x="490" y="310" width="150" height="31.0" rx="4" fill="#EFEFEF" stroke="#777777" stroke-width="0.8" stroke-dasharray="4 2"/><text x="565.0" y="321.5" font-size="9" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">DEAL (3a) · DESTINATION_APPROVAL /</text><line x1="490" y1="324.5" x2="640" y2="324.5" stroke="#777777" stroke-width="0.6"/><text x="494" y="335.0" font-size="8" font-family="Menlo, Consolas, monospace">SETTLEMENT_RAIL (1b)</text><path d="M 250.0 92.2 L 160.0 87.8" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 490.0 79.9 L 400.0 88.6" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 490.0 152.0 L 480.0 150.0 L 400.0 122.0" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 602.3 220.0 L 630.0 200.0 L 581.7 105.5" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 85.0 200.0 L 85.0 128.5" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 327.0 220.0 L 330.0 180.0 L 328.3 151.5" fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><text x="329.1543026706231" y="162.75" font-size="7" font-family="Helvetica, Arial, sans-serif" fill="#555" text-anchor="middle">subject</text><path d="M 250.0 413.9 L 160.0 410.1" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 160.0 403.6 L 240.0 400.0 L 309.4 151.5" fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><path d="M 361.9 151.5 L 480.0 330.0 L 490.0 329.5" fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><path d="M 98.2 354.0 L 160.0 480.0 L 524.4 341.0" fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><path d="M 339.2 364.0 L 400.0 480.0 L 548.4 341.0" fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><text x="10" y="470" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">Changed since v5.9: SETTLEMENT_LINE records when it was released, by when the rail should confirm it, and when it ended, so the named state &quot;sent, not yet confirmed&quot;</text><text x="10" y="482" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">can be shown and aged (Lifecycle &amp; Approvals §7; Ledger Posting Design rule 13a). The promise is discharged on release; a return or a short delivery re-raises it.</text><rect x="10" y="498" width="12" height="9" fill="#FDE4C8" stroke="#C8782A" stroke-width="0.8"/><text x="26" y="506" font-size="7" font-family="Helvetica, Arial, sans-serif">transactional event</text><rect x="160" y="498" width="12" height="9" fill="#EFEFEF" stroke="#777777" stroke-width="0.8"/><text x="176" y="506" font-size="7" font-family="Helvetica, Arial, sans-serif">derived view (never stored)</text></svg>