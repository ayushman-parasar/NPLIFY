rker-end="url(#arr)"/><path d="M 158.0 258.1 L 160.0 258.0 L 201.8 225.5" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 170.0 267.4 L 158.0 266.6" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 158.0 340.6 L 160.0 340.0 L 203.1 305.5" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 488.0 69.9 L 486.0 69.9" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 561.0 115.0 L 561.0 105.5" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 561.0 190.0 L 561.0 192.0" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 412.0 115.0 L 412.0 94.0" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 412.0 170.0 L 412.0 157.5" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 393.3 262.0 L 330.0 190.0 L 394.0 94.0" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 528.5 262.0 L 490.0 230.0 L 424.9 94.0" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 369.2 330.0 L 330.0 300.0 L 402.5 94.0" fill="none" stroke="#555" stroke-width="0.9" marker-end="url(#arr)"/><path d="M 338.0 360.3 L 330.0 360.0 L 276.3 305.5" fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><path d="M 570.5 400.0 L 630.0 230.0 L 448.1 94.0" fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#arr)"/><text x="10" y="510" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">Rules: a counterparty receiver sits in exactly one group; sender_return and partner_transit receivers are group-less; an account is</text><text x="10" y="522" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">payable through a partner only with an approved DESTINATION_APPROVAL; a fee structure is a new row per version; partner_pricing agrees</text><text x="10" y="534" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#222" text-anchor="start" font-style="italic">with PARTNER.disclosure_style; a single-use account or endpoint names the one deal it serves. No table changed in this block since v5.9.</text><rect x="10" y="552" width="12" height="9" fill="#DCE9F8" stroke="#4A6FA5" stroke-width="0.8"/><text x="26" y="560" font-size="7" font-family="Helvetica, Arial, sans-serif">configuration &amp; master data</text><rect x="160" y="552" width="12" height="9" fill="#EFEFEF" stroke="#777777" stroke-width="0.8"/><text x="176" y="560" font-size="7" font-family="Helvetica, Arial, sans-serif">derived view (never stored)</text></svg>