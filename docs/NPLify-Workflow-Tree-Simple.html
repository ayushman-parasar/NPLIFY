<!DOCTYPE html>

<title>NPLify Workflow Tree (simple)</title>
<style>

  html, body { background: #fff; margin: 0; }

<h1>NPLify workflows, as one tree</h1>
<p>Eight classes of workflow, read left to right in the order of a deal's day, each with its sub-classes beneath it.</p>

<rect x="464" y="18" width="200" height="40" rx="8" fill="#1F2937"/>
<text x="564" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">NPLify workflows</text>
<line x1="564" y1="58" x2="564" y2="80" stroke="#9CA3AF" stroke-width="1.6"/>
<line x1="81" y1="80" x2="1047" y2="80" stroke="#9CA3AF" stroke-width="1.6"/>
<line x1="81" y1="80" x2="81" y2="102" stroke="#9CA3AF" stroke-width="1.6"/>
<rect x="16" y="102" width="130" height="50" rx="7" fill="#3B5BDB"/>
<text x="81" y="132" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Configure &amp; set up</text>
<line x1="81" y1="152" x2="81" y2="370" stroke="#3B5BDB" stroke-width="1.6"/>
<rect x="16" y="178" width="130" height="52" rx="6" fill="#E7ECFB" stroke="#3B5BDB" stroke-width="1.4"/>

<text x="81" y="215.8" text-anchor="middle" font-size="12" fill="#111827">project</text>
<rect x="16" y="242" width="130" height="52" rx="6" fill="#E7ECFB" stroke="#3B5BDB" stroke-width="1.4"/>

<text x="81" y="279.8" text-anchor="middle" font-size="12" fill="#111827">configuration</text>
<rect x="16" y="306" width="130" height="52" rx="6" fill="#E7ECFB" stroke="#3B5BDB" stroke-width="1.4"/>
<text x="81" y="329.2" text-anchor="middle" font-size="12" fill="#111827">Parties, endpoints</text>
<text x="81" y="343.8" text-anchor="middle" font-size="12" fill="#111827">and destinations</text>
